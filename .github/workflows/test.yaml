name: Test apworld
on:
  push:
  pull_request:

env:
  AP_TEST_WORLDS: ffxiv

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: Eijebong/ap-actions/ap-tests@main
        with:
          apworld-path: src
          apworld-name: ffxiv
          ap-version: latest
          python-version: '3.13'
